name: Release

# package.json 의 version 을 올리고 'v1.2.3' 같은 태그를 push 하면
# Windows 설치 파일을 만들어 이 저장소의 Release 로 올린다.
# 태그 없이 Actions 화면의 [Run workflow] 로 돌려도 된다 (그때는 package.json 버전으로 태그가 생긴다).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 태그와 package.json 버전이 같은지 확인
        if: github.ref_type == 'tag'
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: 릴리스 준비 (태그 만들기, 덜 만들어진 릴리스 정리)
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # 예전 방식(electron-builder 가 직접 올리던 때)에 생긴 빈 초안 릴리스 정리
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate -q '.[] | select(.draft) | .id'); do
            echo "초안 릴리스 $id 삭제"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            ASSETS="$(gh release view "$TAG" --json assets -q '.assets[].name')"
            if echo "$ASSETS" | grep -q '\.exe$' && echo "$ASSETS" | grep -qx 'latest.yml'; then
              echo "::error::$TAG 은(는) 이미 배포되었습니다. package.json 버전을 먼저 올려 주세요 (npm version patch)."
              exit 1
            fi
            echo "파일이 빠진 $TAG 릴리스를 지우고 다시 만듭니다."
            gh release delete "$TAG" -y
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            # 수동 실행: 지금 커밋에 태그를 (다시) 붙인다
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              git push origin ":refs/tags/$TAG"
            fi
            git tag -f "$TAG"
            git push origin "$TAG"
          fi
      # 설치 파일은 여기서 만들기만 하고 (electron-builder 가 직접 올리면 릴리스가 겹쳐 만들어지는 문제가 있음)
      - run: npm run dist
      - name: 릴리스 올리기 (설치 파일 + 업데이트 정보를 모두 올린 다음 공개)
        shell: bash
        run: |
          EXE="release/PawnShopManager-Setup-$VERSION.exe"
          ls -l release
          test -f "$EXE" && test -f "$EXE.blockmap" && test -f release/latest.yml
          grep -q "version: $VERSION" release/latest.yml
          gh release create "$TAG" --verify-tag --draft --title "$VERSION" --notes "" "$EXE" "$EXE.blockmap" release/latest.yml
          gh release edit "$TAG" --draft=false --latest
          gh release view "$TAG" --json assets -q '.assets[].name'
