name: Release

# package.json 의 version 을 올리고 'v1.2.3' 같은 태그를 push 하면
# Windows 설치 파일을 만들어 이 저장소의 Release 로 올린다.
# 태그 없이 Actions 화면의 [Run workflow] 로 돌려도 된다 (그때는 package.json 버전으로 태그가 생긴다).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 태그와 package.json 버전이 같은지 확인
        if: github.ref_type == 'tag'
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: 릴리스 준비 (태그 만들기, 덜 만들어진 릴리스 정리)
        shell: bash
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -q '\.exe$'; then
              echo "::error::$TAG 은(는) 이미 배포되었습니다. package.json 버전을 먼저 올려 주세요 (npm version patch)."
              exit 1
            fi
            echo "설치 파일이 빠진 $TAG 릴리스를 지우고 다시 만듭니다."
            gh release delete "$TAG" -y
          fi
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            # 수동 실행: 지금 커밋에 태그를 (다시) 붙인다
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              git push origin ":refs/tags/$TAG"
            fi
            git tag -f "$TAG"
            git push origin "$TAG"
          fi
      # 설치 파일을 모두 올린 다음에 공개한다 (중간에 실패해도 반쪽짜리 릴리스가 공개되지 않게)
      - run: npm run release
      - name: 릴리스 공개
        shell: bash
        run: gh release edit "$TAG" --draft=false --latest
