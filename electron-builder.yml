appId: com.jeonghyeoni.pawnshop
productName: 전당포 관리
directories:
  output: release
files:
  - dist/**
  - package.json
asarUnpack:
  - node_modules/sql.js/dist/sql-wasm.wasm
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: PawnShopManager-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  shortcutName: 전당포 관리
  deleteAppDataOnUninstall: false
# 설치 파일은 이 (공개) 저장소의 Releases 에 올라가고 (.github/workflows/release.yml 이 gh 로 올림),
# 클라이언트 PC 프로그램은 최신 Release 의 latest.yml 을 보고 업데이트한다.
publish:
  provider: github
  owner: jeonghyeoni
  repo: IT-pawn-shop-customer-management
